{% extends 'layouts/base.html' %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-3">Cotizaciones Global Exchange</h2>
    
    <!-- Mantiene tu tabla existente -->
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Moneda</th>
                <th>Compra</th>
                <th>Venta</th>
            </tr>
        </thead>
        <tbody>
            {% for cotizacion in cotizaciones %}
            <tr>
                <td>{{ cotizacion.moneda }}</td>
                <td>{{ cotizacion.precio_compra }}</td>
                <td>{{ cotizacion.precio_venta }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="3">No hay cotizaciones registradas.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
