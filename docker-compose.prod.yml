services:

  db:
    image: postgres:16-alpine
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-pguser} -d ${POSTGRES_DB:-globalexchange}"
        ]
      interval: 5s
      retries: 5
    restart: unless-stopped


  keycloak:
    image: quay.io/keycloak/keycloak:24.0

    command: start-dev --import-realm

    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-globalexchange}
      KC_DB_USERNAME: ${POSTGRES_USER:-pguser}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-pgpassword}

      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin123}

      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: "localhost"

    ports:
      - "8080:8080"

    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped


  web:
    build:
      context: .
      dockerfile: docker/django/Dockerfile.prod

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn core.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
      "

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - static_volume:/app/staticfiles

    restart: unless-stopped


  nginx:
    image: nginx:alpine

    ports:
      - "80:80"

    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro

    depends_on:
      - web

    restart: unless-stopped


volumes:
  postgres_data:
  static_volume: